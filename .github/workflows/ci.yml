name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --configuration Release

  installer-windows:
    name: Installer tests on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/InstallerReleaseSelection.Tests.ps1
          ./tests/InstallerEndToEnd.Tests.ps1

      - name: PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/InstallerReleaseSelection.Tests.ps1
          ./tests/InstallerEndToEnd.Tests.ps1

  # Downloads the published release, so a network or GitHub API rate-limit failure must not fail CI.
  installer-live-windows:
    name: Live install on Windows (informational)
    runs-on: windows-latest
    continue-on-error: true
    env:
      DEVCRAFT_REPOSITORY: ${{ github.repository }}
      DEVCRAFT_NO_MODIFY_PATH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:DEVCRAFT_HOME = Join-Path $env:RUNNER_TEMP "devcraft-live-5"
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          if (-not (Test-Path (Join-Path $env:DEVCRAFT_HOME "devcraft.exe"))) { throw "devcraft.exe was not installed" }
          if (-not (Test-Path (Join-Path $env:DEVCRAFT_HOME "DevCraft.md"))) { throw "profile was not installed" }

      - name: PowerShell 7
        shell: pwsh
        run: |
          $env:DEVCRAFT_HOME = Join-Path $env:RUNNER_TEMP "devcraft-live-7"
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          if (-not (Test-Path (Join-Path $env:DEVCRAFT_HOME "devcraft.exe"))) { throw "devcraft.exe was not installed" }
          if (-not (Test-Path (Join-Path $env:DEVCRAFT_HOME "DevCraft.md"))) { throw "profile was not installed" }
