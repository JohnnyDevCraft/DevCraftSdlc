name: Release DevCraft

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --configuration Release

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            archive: tar.gz
            executable: devcraft
          - rid: osx-x64
            archive: tar.gz
            executable: devcraft
          - rid: linux-x64
            archive: tar.gz
            executable: devcraft
          - rid: win-x64
            archive: zip
            executable: devcraft.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/DevCraft.Cli/DevCraft.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          --output artifacts/publish/${{ matrix.rid }}

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/package/${{ matrix.rid }}"
          mkdir -p "$package"
          cp -R profile "$package/profile"

          if [[ "${{ matrix.rid }}" == win-* ]]; then
            cp "artifacts/publish/${{ matrix.rid }}/DevCraft.Cli.exe" "$package/devcraft.exe"
            cp install.ps1 "$package/install.ps1"
          else
            cp "artifacts/publish/${{ matrix.rid }}/DevCraft.Cli" "$package/devcraft"
            chmod +x "$package/devcraft"
            cp install.sh "$package/install.sh"
            chmod +x "$package/install.sh"
          fi

      - name: Archive Unix package
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd artifacts/package/${{ matrix.rid }}
          tar -czf ../../DevCraft-${{ matrix.rid }}.tar.gz .

      - name: Archive Windows package
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd artifacts/package/${{ matrix.rid }}
          zip -r ../../DevCraft-${{ matrix.rid }}.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DevCraft-${{ matrix.rid }}
          path: artifacts/DevCraft-${{ matrix.rid }}.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
